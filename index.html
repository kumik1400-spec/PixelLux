<style>
:root{--bg:#000;--p:#a855f7;--m:#d946ef;--v:#6d28d9;--tx:#f3eefc;--mu:#a79bbd;--gl:rgba(168,85,247,.08);--bd:rgba(192,132,252,.22);--r:20px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:700;line-height:1.15;overflow-wrap:break-word}
h1{font-size:clamp(2rem,6.4vw,4.4rem)}h2{font-size:clamp(1.5rem,4vw,2.5rem);margin-bottom:12px}h3{font-size:1.1rem}
p{color:var(--mu)}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--m);outline-offset:3px}
.w{width:min(1120px,100% - 32px);margin-inline:auto}
section{padding:84px 0;position:relative}
.lead{max-width:60ch;margin-bottom:36px}
.grad{background:linear-gradient(90deg,var(--p),var(--m));-webkit-background-clip:text;background-clip:text;color:transparent}
.g{background:var(--gl);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:24px;position:relative;transition:border-color .3s,box-shadow .3s,transform .3s}
.g:hover{border-color:var(--m);box-shadow:0 0 34px rgba(217,70,239,.25);transform:translateY(-3px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 26px;border:0;border-radius:999px;background:linear-gradient(90deg,var(--v),var(--p),var(--m));background-size:200% 100%;color:#fff;font:700 15px Manrope,sans-serif;cursor:pointer;box-shadow:0 0 22px rgba(168,85,247,.5);transition:background-position .5s,box-shadow .3s,transform .2s}
.btn:hover{background-position:100% 0;box-shadow:0 0 38px rgba(217,70,239,.8)}.btn:active{transform:scale(.97)}
.btn.o{background:transparent;border:1px solid var(--bd);box-shadow:none}.btn.o:hover{border-color:var(--m);box-shadow:0 0 24px rgba(217,70,239,.4)}
.grid{display:grid;gap:20px}.c3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:repeat(2,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.tag{display:inline-block;font-size:12px;color:var(--m);border:1px dashed var(--m);border-radius:999px;padding:2px 10px;margin-bottom:10px}
/* nav */
header{position:fixed;inset:0 0 auto;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:700 1.3rem Unbounded,sans-serif}.logo b{color:var(--m);text-shadow:0 0 16px var(--m)}
.menu{display:flex;gap:26px;align-items:center}.menu a{color:var(--mu);font-size:14px;transition:color .2s}.menu a:hover{color:#fff}
.bg{display:none;width:48px;height:48px;background:none;border:1px solid var(--bd);border-radius:12px;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.bg i{width:20px;height:2px;background:#fff;transition:.3s}.bg[aria-expanded=true] i:first-child{transform:translateY(7px) rotate(45deg)}.bg[aria-expanded=true] i:last-child{transform:translateY(-7px) rotate(-45deg)}.bg[aria-expanded=true] i:nth-child(2){opacity:0}
/* hero */
.hero{min-height:100svh;display:flex;align-items:center;padding-top:110px;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;will-change:transform}
.o1{width:460px;height:460px;background:var(--v);opacity:.55;right:-120px;top:8%}.o2{width:320px;height:320px;background:var(--m);opacity:.3;left:-100px;bottom:6%}
.hero .w{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.hero p{font-size:1.1rem;max-width:52ch;margin:22px 0 32px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
/* about / tech */
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(168,85,247,.15);border:1px solid var(--bd);color:var(--m);font:700 13px Unbounded,sans-serif;margin-bottom:14px;box-shadow:0 0 18px rgba(168,85,247,.3)}
.diff{margin-top:20px}.diff ul{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 30px}
.diff li{padding-left:26px;position:relative;color:var(--mu)}.diff li:before{content:"✓";position:absolute;left:0;color:var(--m)}
.tech{text-align:center}.tech .ic{width:64px;height:64px;margin:0 auto 12px;font-size:15px;animation:fl 4s ease-in-out infinite}
.tech .g:nth-child(2n) .ic{animation-delay:-1.3s}.tech .g:nth-child(3n) .ic{animation-delay:-2.6s}
@keyframes fl{50%{transform:translateY(-6px)}}
.tech{grid-template-columns:repeat(6,1fr)}
/* steps */
.steps{counter-reset:s;position:relative}
.steps:before{content:"";position:absolute;top:44px;left:12%;right:12%;height:2px;background:linear-gradient(90deg,var(--v),var(--m));opacity:.4}
.st{cursor:pointer;text-align:center;font:inherit;color:inherit;width:100%}
.st .n{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#000;border:2px solid var(--p);font:700 1.1rem Unbounded,sans-serif;position:relative;transition:.3s}
.st.on .n{background:linear-gradient(135deg,var(--v),var(--m));box-shadow:0 0 28px var(--m)}
.st.on{border-color:var(--m)}
.sd{margin-top:24px;min-height:84px;text-align:center;transition:opacity .25s}
/* pricing */
.pr{display:flex;flex-direction:column}.pr .pc{font:700 1.9rem Unbounded,sans-serif;margin:8px 0 12px}
.pr ul{list-style:none;padding:0;margin:16px 0 24px;display:grid;gap:8px;flex:1}.pr li{padding-left:24px;position:relative;font-size:15px}.pr li:before{content:"✓";position:absolute;left:0;color:var(--m)}
.pr.hot{border-color:var(--m);box-shadow:0 0 40px rgba(217,70,239,.25)}
/* results */
.stat{font:700 2.2rem Unbounded,sans-serif}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:10px}
.bars div{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--m),var(--v));height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 16px rgba(168,85,247,.5);position:relative}
.bars div:after{content:attr(data-l);position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--mu)}
.note{font-size:13px;margin-top:34px;color:var(--mu)}
/* reviews & portfolio */
.ph{min-height:160px;display:flex;flex-direction:column;justify-content:center;border-style:dashed}
.pf{aspect-ratio:16/10;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,rgba(109,40,217,.35),rgba(217,70,239,.12));padding:16px}
/* faq */
.fq{padding:0;margin-bottom:12px;overflow:hidden}.fq:hover{transform:none}
.fq button{width:100%;min-height:56px;padding:16px 22px;background:none;border:0;color:var(--tx);font:700 16px Manrope,sans-serif;text-align:left;display:flex;justify-content:space-between;gap:14px;align-items:center;cursor:pointer}
.fq button:after{content:"+";font-size:24px;color:var(--m);transition:transform .3s;flex:none}.fq button[aria-expanded=true]:after{transform:rotate(45deg)}
.fa{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.fa>div{overflow:hidden}.fa p{padding:0 22px 20px}.fq.open .fa{grid-template-rows:1fr}
/* calc, quiz, form */
.opt{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--bd);border-radius:14px;cursor:pointer;min-height:52px;transition:.25s;background:rgba(0,0,0,.3);font:inherit;color:inherit;text-align:left;width:100%}
.opt:hover,.opt.on,.opt:has(input:checked){border-color:var(--m);box-shadow:0 0 20px rgba(217,70,239,.3);background:rgba(168,85,247,.14)}
.opt input{accent-color:var(--m);width:20px;height:20px;flex:none}.opt span:last-child{margin-left:auto;color:var(--m);font-weight:700;white-space:nowrap}
.opts{display:grid;gap:10px;margin:18px 0}.tot{font:700 2.4rem Unbounded,sans-serif;margin:6px 0 4px}
.pg{height:6px;border-radius:9px;background:rgba(168,85,247,.2);overflow:hidden;margin-bottom:20px}.pg i{display:block;height:100%;width:25%;background:linear-gradient(90deg,var(--p),var(--m));box-shadow:0 0 12px var(--m);transition:width .4s}
label.f{display:block;font-size:14px;color:var(--mu);margin-bottom:16px}
.in{display:block;width:100%;margin-top:6px;padding:14px 16px;border-radius:14px;border:1px solid var(--bd);background:rgba(0,0,0,.45);color:#fff;font:16px Manrope,sans-serif;min-height:50px}
.in:focus{outline:none;border-color:var(--m);box-shadow:0 0 18px rgba(217,70,239,.35)}textarea.in{min-height:120px;resize:vertical}
.qb{max-width:720px;margin-inline:auto}.qn{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
/* footer */
footer{border-top:1px solid var(--bd);padding:64px 0 28px;background:radial-gradient(60% 80% at 50% 0,rgba(109,40,217,.25),transparent)}
.fg{grid-template-columns:1.5fr 1fr 1fr 1fr}footer h3{font-size:.95rem;margin-bottom:14px}footer li{list-style:none;margin-bottom:8px}footer ul{padding:0}footer li a{color:var(--mu);transition:color .2s}footer li a:hover{color:#fff}
.cp{margin-top:40px;padding-top:20px;border-top:1px solid var(--bd);font-size:13px;color:var(--mu)}
@keyframes pu{50%{box-shadow:0 0 46px var(--m)}}
/* reveal */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}.js .rv.in2{opacity:1;transform:none}
@media(max-width:900px){.c3,.c4,.tech{grid-template-columns:repeat(2,1fr)}.fg{grid-template-columns:1fr 1fr}.hero .w{grid-template-columns:1fr}.steps:before{display:none}.c2{grid-template-columns:1fr}}
@media(max-width:720px){
section{padding:60px 0}
.bg{display:flex}
.menu{position:fixed;inset:64px 0 auto;flex-direction:column;align-items:stretch;gap:0;background:rgba(0,0,0,.96);border-bottom:1px solid var(--bd);padding:8px 16px 18px;transform:translateY(-130%);transition:transform .35s;visibility:hidden}
.menu.open{transform:none;visibility:visible}.menu a{padding:15px 4px;font-size:17px;border-bottom:1px solid rgba(168,85,247,.12)}.menu .btn{margin-top:14px;border:0}
.c3,.c4,.c2,.fg{grid-template-columns:1fr}.tech{grid-template-columns:repeat(2,1fr)}.diff ul{grid-template-columns:1fr}
.hero .cta .btn{width:100%}.o1{width:300px;height:300px}.opt{flex-wrap:wrap}.qn .btn{flex:1}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .rv{opacity:1;transform:none}}

/* ===== v2: mirror glass, 3D, intro, support ===== */
html{background:linear-gradient(180deg,#000 0,#08020f 30%,#12052a 55%,#000 80%,#0a0314 100%) #000}
body{background:transparent}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 640px at -8% 40%,rgba(168,85,247,.22),transparent 70%),radial-gradient(520px 640px at 108% 60%,rgba(217,70,239,.18),transparent 70%)}
.g{background:radial-gradient(240px circle at var(--mx,25%) var(--my,0%),rgba(216,180,254,.2),transparent 62%),linear-gradient(115deg,transparent 28%,rgba(255,255,255,.08) 36%,transparent 44%),linear-gradient(150deg,rgba(255,255,255,.1),rgba(124,58,237,.14) 38%,rgba(0,0,0,.6) 72%,rgba(168,85,247,.16));border-color:rgba(216,180,254,.28);box-shadow:var(--sx,0px) var(--sy,12px) 44px rgba(0,0,0,.65),0 0 28px rgba(168,85,247,.14),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -22px 40px rgba(124,58,237,.12);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4)}
.g:hover{border-color:rgba(232,121,249,.8);box-shadow:var(--sx,0px) var(--sy,16px) 54px rgba(0,0,0,.7),0 0 44px rgba(217,70,239,.34),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -22px 40px rgba(124,58,237,.18);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px)}
.fq,.fq:hover,.sd,.sd:hover,form.g,form.g:hover,.qb,.qb:hover,.diff,.diff:hover{transform:none}
.btn{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 52%),linear-gradient(90deg,var(--v),var(--p),var(--m));background-size:100% 100%,200% 100%;background-position:0 0,0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -4px 8px rgba(60,10,120,.5),0 8px 24px rgba(168,85,247,.5);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.btn:hover{background-position:0 0,100% 0;transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -4px 8px rgba(60,10,120,.5),0 12px 34px rgba(217,70,239,.7)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.o{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 55%),rgba(0,0,0,.35);background-size:100% 100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 20px rgba(0,0,0,.5)}
.btn.o:hover{background-position:0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px rgba(217,70,239,.45)}
.pf.g{background:radial-gradient(240px circle at var(--mx,25%) var(--my,0%),rgba(233,213,255,.28),transparent 62%),linear-gradient(115deg,transparent 28%,rgba(255,255,255,.1) 36%,transparent 44%),linear-gradient(135deg,rgba(124,58,237,.5),rgba(0,0,0,.65) 60%,rgba(217,70,239,.25))}
header{background:linear-gradient(180deg,rgba(40,12,80,.55),rgba(0,0,0,.6))}
/* hero 3D */
.hero{background:radial-gradient(70% 60% at 72% 45%,rgba(76,29,149,.4),transparent 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:0;transition:opacity 1.2s}
.hero.gl #gl{opacity:1}.hero.nogl #gl{display:none}
.sculpt-fb{position:absolute;z-index:0;width:min(40vw,440px);aspect-ratio:1;right:9%;top:50%;transform:translateY(-50%);border-radius:50%;pointer-events:none;background:conic-gradient(from 200deg,#05010c,#7c3aed,#f3e8ff,#2a0a55,#d946ef,#0a0214,#a855f7,#05010c);-webkit-mask:radial-gradient(circle,transparent 36%,#000 38%,#000 62%,transparent 64%);mask:radial-gradient(circle,transparent 36%,#000 38%,#000 62%,transparent 64%);filter:drop-shadow(0 0 40px rgba(168,85,247,.6));transition:opacity 1.2s}
.hero.gl .sculpt-fb{opacity:0}
.hero .w>div>:nth-child(2){--i:1}.hero .w>div>:nth-child(3){--i:2}
.js .hero .w>div>*{opacity:0;animation:hi .9s calc(var(--d,1.7s) + var(--i,0)*.15s) cubic-bezier(.2,.8,.2,1) forwards}
.nointro{--d:.1s}
@keyframes hi{from{transform:translateY(24px)}to{opacity:1;transform:none}}
/* intro */
#intro{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(124,58,237,.5),rgba(40,8,80,.5) 30%,#000 66%),#000}
.js:not(.nointro) #intro{display:grid;animation:ix .8s 1.55s ease forwards}
@keyframes ix{to{opacity:0;visibility:hidden;transform:scale(1.08)}}
.il{font:700 clamp(2.4rem,10vw,4.8rem) Unbounded,sans-serif;opacity:0;transform:scale(.9);filter:blur(10px);animation:il 1s .25s ease forwards}
.il b{color:var(--m)}
@keyframes il{to{opacity:1;transform:none;filter:blur(0);text-shadow:0 0 30px var(--m),0 0 80px var(--p)}}
/* support panel */
.sp{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:999px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(124,58,237,.18) 40%,rgba(0,0,0,.6));border:1px solid rgba(216,180,254,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 0 34px rgba(168,85,247,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.sp a,.sp button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bd);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(0,0,0,.1)),rgba(76,29,149,.5);color:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}
.sp a:hover,.sp button:hover{transform:scale(1.1);box-shadow:0 0 22px var(--m)}
.sp svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sp svg.f{fill:currentColor;stroke:none}
.sp .sb{animation:pu 2.6s infinite;background:linear-gradient(135deg,var(--v),var(--m))}
@keyframes pu{50%{box-shadow:0 0 46px var(--m)}}
.sp [data-t]:hover:after{content:attr(data-t);position:absolute;right:58px;top:50%;transform:translateY(-50%);white-space:nowrap;padding:6px 12px;border-radius:10px;background:rgba(0,0,0,.88);border:1px solid var(--bd);font-size:13px}
.sw{position:fixed;right:88px;top:50%;z-index:79;width:min(330px,100vw - 120px);padding:24px 22px 22px;border-radius:22px;transform:translate(16px,-50%) scale(.96);opacity:0;visibility:hidden;transition:opacity .3s,transform .3s,visibility .3s;background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(124,58,237,.2) 40%,rgba(0,0,0,.8));border:1px solid rgba(216,180,254,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(168,85,247,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.sw.open{opacity:1;visibility:visible;transform:translate(0,-50%)}
.sw h3{margin-bottom:8px}.sw p{margin-bottom:12px;color:var(--tx)}.sw .btn{width:100%;margin-top:10px;font-size:14px;padding-inline:14px}
.sx{position:absolute;top:8px;right:10px;width:40px;height:40px;border-radius:50%;background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
/* laptop / large desktop */
@media(min-width:721px) and (max-width:1240px){.w{width:calc(100% - 128px);margin-left:32px;margin-right:96px}}
@media(min-width:901px) and (max-height:780px){.hero{padding-top:84px}h1{font-size:clamp(2rem,4.4vw,3.3rem)}.hero p{margin:16px 0 24px}section{padding:68px 0}}
@media(min-width:1500px){.w{width:min(1280px,100% - 200px)}h1{font-size:clamp(3rem,4.6vw,5rem)}}
@media(max-width:900px){.hero{align-items:flex-end;padding:96px 0 40px}.sculpt-fb{width:min(62vw,280px);right:auto;left:50%;top:24%;transform:translate(-50%,-50%)}.o1{opacity:.3}}
@media(max-width:720px){
.sp{right:14px;bottom:14px;top:auto;transform:none;padding:0;gap:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.sp>:not(.sb){display:none}.sp .sb{width:58px;height:58px}
.sw{right:14px;top:auto;bottom:84px;width:min(340px,100vw - 28px);transform:translateY(12px) scale(.96)}.sw.open{transform:none}
}
@media(prefers-reduced-motion:reduce){#intro{display:none!important}.js .hero .w>div>*{opacity:1!important;transform:none!important}}

<main id="top">
<section class="hero">
<div class="orb o1" data-sp=".08"></div><div class="orb o2" data-sp="-.05"></div>
<div class="sculpt-fb" aria-hidden="true"></div><canvas id="gl" aria-hidden="true"></canvas>
<div class="w">
